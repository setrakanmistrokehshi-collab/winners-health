name: Build Android APK

# Trigger: runs on every push to main, or manually from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you click "Run workflow" manually on GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # add any other VITE_ env vars your build needs, as GitHub secrets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-frontend-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk